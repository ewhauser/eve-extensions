packages:
  - apps/*
  - packages/*

catalog:
  "@ai-sdk/openai": ^4.0.41
  "@aws-sdk/client-lambda-microvms": 3.1106.0
  "@types/node": ^24.0.0
  ai: ^7.0.58
  eve: 0.38.0
  typescript: ^5.6.0
  vitest: ^4.1.10
  zod: ^4.4.3

allowBuilds:
  esbuild: true

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly, and Eve is exempt so this repository can track
# the version it is validating against without waiting for the cooldown.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - eve@0.38.0

patchedDependencies:
  eve@0.38.0: patches/eve@0.38.0.patch
