packages:
  - apps/*
  - packages/*

catalog:
  "@ai-sdk/openai": ^4.0.30
  "@aws-sdk/client-lambda-microvms": 3.1075.0
  "@types/node": ^26.1.2
  "@typescript/typescript6": ^6.0.2
  ai: ^7.0.58
  eve: 0.38.0
  typescript: ^7.0.2
  vitest: ^4.1.10
  zod: ^4.4.3

allowBuilds:
  esbuild: true

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly, and Eve is exempt so this repository can track
# the version it is validating against without waiting for the cooldown.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - eve@0.38.0

patchedDependencies:
  eve@0.38.0: patches/eve@0.38.0.patch
  eve@0.45.0: packages/eve-openai-connectors/patches/eve@0.45.0.patch
