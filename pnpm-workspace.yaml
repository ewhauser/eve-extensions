packages:
  - apps/*
  - packages/*

catalog:
  "@ai-sdk/openai": ^4.0.58
  "@aws-sdk/client-lambda-microvms": 3.1121.0
  "@types/node": ^26.4.0
  "@typescript/typescript6": ^6.0.2
  ai: ^7.0.92
  eve: 0.49.0
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.5.4

allowBuilds:
  esbuild: true

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly, and Eve is exempt so this repository can track
# the version it is validating against without waiting for the cooldown.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - eve@0.49.0

patchedDependencies:
  eve@0.49.0: patches/eve@0.49.0.patch
