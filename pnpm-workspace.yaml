packages:
  - apps/*
  - packages/*

catalog:
  "@ai-sdk/openai": ^4.0.50
  "@aws-sdk/client-lambda-microvms": 3.1116.0
  "@types/node": ^26.1.2
  "@typescript/typescript6": ^6.0.2
  ai: ^7.0.105
  eve: 0.63.0
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.4.3

allowBuilds:
  # Optional just-bash native codecs are not used by the portable Worker bundle.
  "@mongodb-js/zstd": false
  esbuild: true
  node-liblzma: false

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly, and Eve is exempt so this repository can track
# the version it is validating against without waiting for the cooldown.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - eve@0.63.0

patchedDependencies:
  eve@0.63.0: patches/eve@0.63.0.patch
