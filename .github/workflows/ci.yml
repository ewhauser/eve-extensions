name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Node 24 / pnpm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      EVE_AMBIENT_POSTGRES_URL: postgresql:///eve_ambient_test?host=/var/run/postgresql
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate integrity-pinned pnpm
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version

      - name: Start PostgreSQL conformance database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser runner
          sudo -u postgres createdb --owner=runner eve_ambient_test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run offline checks
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level high
